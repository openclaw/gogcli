name: Release (unified)

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to release
        required: true
        type: string
      dry_run:
        description: Build and verify without creating tags or publishing
        type: boolean
        default: false

permissions: {}

jobs:
  preflight:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate GogCLI version metadata
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          release_version=${VERSION#v}
          source_version=$(tr -d '\r\n' < internal/cmd/VERSION)
          source_version=${source_version#v}
          if [[ "$DRY_RUN" == true ]]; then
            source_version=${source_version%-dev}
          fi
          test "$source_version" = "$release_version"

      - name: Preflight Apple notarization access
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp "$RUNNER_TEMP/notary-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s' "$ASC_PRIVATE_KEY_P8" > "$key"
          xcrun notarytool history --key "$key" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" --output-format json > "$RUNNER_TEMP/notary-history.json"
          jq -e '.history | type == "array"' "$RUNNER_TEMP/notary-history.json"

  release:
    needs: preflight
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-go-cli.yml@v1
    with:
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry_run }}
      repository-type: openclaw
      homebrew-tap: openclaw/homebrew-tap
      homebrew-formula: gogcli
      checksum-filename: checksums.txt
      nfpm: auto
      build-runner: macos
      stable-identifier: com.steipete.gogcli.gog
      darwin-universal: disabled
      reproducible-rebuild: non-darwin
    secrets:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
